name: MacOS1012

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - '**'
      - '.github/workflows/macos1012.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - '**'
      - '.github/workflows/macos1012.yml'

jobs:
  build:
    name: Build
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja qt@5 qscintilla2
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)"
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Xiasl-MacOS1012
          path: |
            build/Xiasl
            build/Xiasl.app
