name: Linux

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - '**'
      - '.github/workflows/ubuntu.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - '**'
      - '.github/workflows/ubuntu.yml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qtbase5-dev qttools5-dev libqt5network5 libqscintilla2-qt5-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: Xiasl-Linux
          path: build/Xiasl
